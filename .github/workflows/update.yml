name: update-policy-site
on:
  schedule:
    # UTC 01:00-10:00 = 北京时间 09:00-18:00，每小时一次
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: update-policy-site
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装部署依赖
        run: npm install --no-audit --no-fund

      - name: 抓取最新政策并部署
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 shanghai-tech-policy/scripts/update.py

      - name: 把数据变更提交回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A shanghai-tech-policy/data
          if git diff --quiet --cached; then
            echo "没有数据变更"
          else
            git commit -m "chore: 定时更新政策数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
